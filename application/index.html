<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI E-Commerce Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f4f6;
            color: #222;
        }
        header {
            background: #172554;
            color: white;
            padding: 24px;
            text-align: center;
        }
        main {
            max-width: 900px;
            margin: 35px auto;
            padding: 20px;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px #0001;
        }
        button {
            background: #2563eb;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        footer {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>AI E-Commerce Store</h1>
        <p>Cloud-Native Shopping Experience</p>
    </header>

    <main>
        <h2>Featured Products</h2>
        <div class="products">
            <div class="card">
                <h3>Wireless Headphones</h3>
                <p>Price: ₹1,499</p>
                <button onclick="addToCart('Wireless Headphones')">
                    Add to Cart
                </button>
            </div>
            <div class="card">
                <h3>Smart Watch</h3>
                <p>Price: ₹2,499</p>
                <button onclick="addToCart('Smart Watch')">
                    Add to Cart
                </button>
            </div>
            <div class="card">
                <h3>Gaming Mouse</h3>
                <p>Price: ₹899</p>
                <button onclick="addToCart('Gaming Mouse')">
                    Add to Cart
                </button>
            </div>
        </div>

        <h2 id="cart">Cart Items: 0</h2>
        <p id="message">Welcome to our store!</p>
    </main>

    <footer>
        <p>AI-Powered E-Commerce DevOps Project</p>
        <p>Containerized | CI/CD Ready | Cloud-Native</p>
    </footer>

    <script>
        let cartCount = 0;

        function addToCart(product) {
            cartCount++;
            document.getElementById('cart').textContent =
                'Cart Items: ' + cartCount;

            document.getElementById('message').textContent =
                product + ' added to cart!';
        }
    </script>
</body>
</html>
